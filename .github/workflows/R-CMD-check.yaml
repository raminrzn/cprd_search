name: R-CMD-check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, manual: true}
          - {os: ubuntu-latest, r: devel, manual: false}
          - {os: ubuntu-latest, r: oldrel-1, manual: false}
          - {os: windows-latest, r: release, manual: false}
          - {os: macos-latest, r: release, manual: false}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      OMP_THREAD_LIMIT: 2
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_CRAN_INCOMING_: ${{ matrix.config.manual && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual
      - name: Install manual typesetting support
        if: matrix.config.manual
        run: tlmgr install collection-fontsrecommended inconsolata texinfo
      - name: Install HTML manual validator
        if: matrix.config.manual
        run: sudo apt-get update && sudo apt-get install -y tidy
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--as-cran", "--no-manual")' }}
          error-on: '"warning"'
          upload-results: true
  submission-tarball:
    name: Verify release tarball on R-devel
    needs: check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_THREAD_LIMIT: 2
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_CRAN_INCOMING_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: actions/download-artifact@v5
        with:
          name: Linux-X64-rrelease-0-results
          path: release-build
      - name: Check the release-built source archive without rebuilding it
        shell: Rscript {0}
        run: |
          tarball <- list.files("release-build", pattern = "[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(tarball) == 1L)
          rcmdcheck::rcmdcheck(path = tarball, args = c("--as-cran", "--no-manual"),
                              error_on = "warning", check_dir = "submission-check")
      - name: Record source archive checksum
        run: sha256sum release-build/*.tar.gz > source-SHA256.txt
      - name: Audit file writes in the exact submission archive
        run: Rscript .github/scripts/check-package-side-effects.R release-build/*.tar.gz
      - name: Audit links in the exact submission archive
        # CPRD's public homepage was verified in a browser on 2026-10-19;
        # its web firewall returns 403 to automated HEAD and GET requests.
        run: >-
          python3 .github/scripts/check-package-links.py release-build/*.tar.gz
          --report package-links.json
          --browser-verified-url https://www.cprd.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRAN-submission-bundle
          path: |
            release-build/*.tar.gz
            submission-check
            source-SHA256.txt
            package-links.json
          if-no-files-found: error
