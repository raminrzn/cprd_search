name: R-CMD-check
on:
  push:
    branches: [main, cran-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release, manual: true}
          - {os: ubuntu-latest, r: devel, manual: false}
          - {os: ubuntu-latest, r: oldrel-1, manual: false}
          - {os: windows-latest, r: release, manual: false}
          - {os: macos-latest, r: release, manual: false}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      OMP_THREAD_LIMIT: 2
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_CRAN_INCOMING_: ${{ matrix.config.manual && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual
      - name: Install manual typesetting support
        if: matrix.config.manual
        run: tlmgr install collection-fontsrecommended inconsolata texinfo
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--as-cran", "--no-manual")' }}
          error-on: '"warning"'
          upload-results: true
